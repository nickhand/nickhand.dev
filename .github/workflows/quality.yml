name: Main site quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
      - run: npm install --global npm@11.18.0
      - run: npm ci
      - run: npm run check
      - run: npm run dry-run:cloudflare:staging
